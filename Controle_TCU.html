async function supabaseSignIn(email, password) {
  const sb = getSupabase();
  if (!sb) throw new Error('Supabase não configurado.');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return data.user;
}

async function supabaseSignUp(email, password) {
  const sb = getSupabase();
  if (!sb) throw new Error('Supabase não configurado.');
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) throw error;
  return data.user;
}

async function supabaseSignOut() {
  const sb = getSupabase();
  if (!sb) return;
  await sb.auth.signOut();
}

async function supabaseGetUser() {
  const sb = getSupabase();
  if (!sb) return null;
  const { data: { user } } = await sb.auth.getUser();
  return user;
}

function supabaseOnAuthChange(callback) {
  const sb = getSupabase();
  if (!sb) return () => {};
  const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
    callback(session?.user || null);
  });
  return () => subscription.unsubscribe();
}

/* ============================= SUPABASE SYNC ============================= */
// Carrega estado do Supabase (cloud) com fallback para localStorage (offline/deslogado)
async function loadStateFromCloud(userId) {
  const sb = getSupabase();
  if (!sb || !userId) return null;
  try {
    const { data, error } = await sb
      .from('user_state')
      .select('payload')
      .eq('user_id', userId)
      .maybeSingle();
    if (error) throw error;
    return data?.payload || null;
  } catch (e) {
    console.warn('[Supabase] Falha ao carregar estado da nuvem, usando local.', e);
    return null;
  }
}

// Salva estado no Supabase (upsert — cria ou atualiza a linha do usuário)
async function saveStateToCloud(userId, state) {
  const sb = getSupabase();
  if (!sb || !userId) return false;
  try {
    const { error } = await sb
      .from('user_state')
      .upsert(
        { user_id: userId, payload: state },
        { onConflict: 'user_id' }
      );
    if (error) throw error;
    return true;
  } catch (e) {
    console.warn('[Supabase] Falha ao salvar na nuvem, dados preservados localmente.', e);
    return false;
  }
}

// Debounce para não disparar saves a cada keystroke
function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

const debouncedSaveToCloud = debounce(saveStateToCloud, 1500);

    const saved = JSON.parse(raw);

    let loadedCycle = def.cycle;
    if (Array.isArray(saved.cycle) && saved.cycle.length > 0) {
      loadedCycle = saved.cycle.map((c, i) => ({
        id: c.id || ('step_' + i + '_' + (c.disciplineId || 'item')),
        disciplineId: c.disciplineId || 'audg',
        targetMinutes: c.targetMinutes || (c.hours ? Math.round(c.hours * 60) : 60),
        studiedSeconds: Number(c.studiedSeconds) || 0,
      }));
    }

    const mergedDisciplinas = {};
    Object.keys(def.disciplinas).forEach(k => {
      mergedDisciplinas[k] = Object.assign({}, def.disciplinas[k], (saved.disciplinas && saved.disciplinas[k]) || {});
    });

    return {
      topics: Object.assign({}, def.topics, saved.topics || {}),
      disciplinas: Object.assign({}, mergedDisciplinas, saved.disciplinas || {}),
      settings: Object.assign({}, def.settings, saved.settings || {}),
      history: Object.assign({}, saved.history || {}),
      activities: Array.isArray(saved.activities) ? saved.activities : [],
      cycle: loadedCycle,
      cycleRoundsCompleted: Number(saved.cycleRoundsCompleted) || 0,
      customDisciplines: Array.isArray(saved.customDisciplines) ? saved.customDisciplines : [],
      customMetas: Object.assign({}, saved.customMetas || {}),
    };
  } catch (e) {
    console.error('Falha ao carregar estado:', e);
    return buildDefaultState();
  }
}

function compactState(state) {
  const compactTopics = {};
  if (state.topics) {
    Object.keys(state.topics).forEach(tid => {
      const t = state.topics[tid];
      if (t && (t.teoria || t.revisao || t.feitas > 0 || t.acertos > 0 || t.incidencia)) {
        compactTopics[tid] = {
          ...(t.teoria ? { t: 1 } : {}),
          ...(t.revisao ? { r: 1 } : {}),
          ...(t.feitas ? { f: t.feitas } : {}),
          ...(t.acertos ? { a: t.acertos } : {}),
          ...(t.incidencia ? { i: t.incidencia } : {}),
        };
      }
    });
  }

  const compactDisc = {};
  if (state.disciplinas) {
    Object.keys(state.disciplinas).forEach(id => {
      if (state.disciplinas[id]?.obs?.trim()) {
        compactDisc[id] = { obs: state.disciplinas[id].obs.trim() };
      }
    });
  }

  return {
    _v: 2,
    s: state.settings,
    h: state.history,
    a: state.activities,
    c: state.cycle,
    cr: state.cycleRoundsCompleted,
    cd: state.customDisciplines,
    cm: state.customMetas,
    t: compactTopics,
    d: compactDisc,
  };
}

function expandState(c) {
  if (!c || c._v !== 2) return c;
  const def = buildDefaultState();
  const expandedTopics = Object.assign({}, def.topics);

  if (c.t) {
    Object.keys(c.t).forEach(tid => {
      const ct = c.t[tid];
      expandedTopics[tid] = {
        incidencia: ct.i || '',
        teoria: Boolean(ct.t),
        revisao: Boolean(ct.r),
        feitas: Number(ct.f) || 0,
        acertos: Number(ct.a) || 0,
      };
    });
  }

  const expandedDisc = Object.assign({}, def.disciplinas);
  if (c.d) {
    Object.keys(c.d).forEach(id => {
      expandedDisc[id] = { open: false, obs: c.d[id].obs || '' };
    });
  }

  return {
    topics: expandedTopics,
    disciplinas: expandedDisc,
    settings: c.s || def.settings,
    history: c.h || {},
    activities: c.a || [],
    cycle: c.c || def.cycle,
    cycleRoundsCompleted: c.cr || 0,
    customDisciplines: c.cd || [],
    customMetas: c.cm || {},
  };
}

function encodeState(state) {
  const minified = compactState(state);
  const json = JSON.stringify(minified);
  if (typeof LZString !== 'undefined') {
    return 'LZ:' + LZString.compressToEncodedURIComponent(json);
  }
  return btoa(unescape(encodeURIComponent(json)));
}

function decodeState(code) {
  const trimmed = code.trim();
  let json = '';
  if (trimmed.startsWith('LZ:') && typeof LZString !== 'undefined') {
    json = LZString.decompressFromEncodedURIComponent(trimmed.slice(3));
  } else {
    json = decodeURIComponent(escape(atob(trimmed)));
  }
  const parsed = JSON.parse(json);
  return expandState(parsed);
}

function pct(part, total) {
  if (!total) return 0;
  return Math.round((part / total) * 1000) / 10;
}
function accColor(p, hasData) {
  if (!hasData) return { text:'text-ink-400', bar:'#AEBDD4', bg:'bg-ink-50' };
  if (p >= 75) return { text:'text-okgreen', bar:'#2F7D53', bg:'bg-okgreen/10' };
  if (p >= 50) return { text:'text-okamber', bar:'#B8862B', bg:'bg-okamber/10' };
  return { text:'text-okred', bar:'#AE4436', bg:'bg-okred/10' };
}
function normalize(s) {
  return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function todayStr() {
  return new Date().toLocaleDateString('sv-SE');
}
function daysBetween(dateStrA, dateStrB) {
  const a = new Date(dateStrA + 'T00:00:00');
  const b = new Date(dateStrB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toLocaleDateString('sv-SE');
}
function formatBR(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR');
}
function formatDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'min';
  if (m > 0) return m + 'min';
  return s + 's';
}
function formatHMS(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return h + ':' + m + ':' + sec;
}
function formatTarget(minutes) {
  const m = Math.max(0, Math.round(minutes || 0));
  const h = Math.floor(m / 60);
  const rem = m % 60;
  if (h > 0 && rem > 0) return h + 'h ' + rem + 'm';
  if (h > 0) return h + 'h';
  return rem + 'm';
}
function formatHMSBrief(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return sec > 0 ? (h + 'h ' + m + 'm ' + sec + 's') : (m > 0 ? (h + 'h ' + m + 'm') : (h + 'h'));
  if (m > 0) return sec > 0 ? (m + 'm ' + sec + 's') : (m + 'm');
  return sec + 's';
}
function heatColor(value) {
  const v = Math.max(0, Math.min(100, value));
  const hue = (v / 100) * 120;
  return 'hsl(' + hue.toFixed(0) + ', 58%, 42%)';
}
function buildTopSegments(segments, max) {
  const list = Array.isArray(segments) ? segments : [];
  if (list.length <= max) return list;
  const top = list.slice(0, max - 1);
  const restSeconds = list.slice(max - 1).reduce((a, s) => a + s.seconds, 0);
  return top.concat([{ discId: 'outras', sigla: 'OUTR', label: 'Outras matérias', seconds: restSeconds, color: '#5a729c' }]);
}

function projectCompletion(startDate, itemsDone, totalItems, marginPercent) {
  if (!startDate) return { status: 'no-start' };
  if (itemsDone >= totalItems) return { status: 'done' };
  if (itemsDone <= 0) return { status: 'no-progress' };
  const elapsed = daysBetween(startDate, todayStr());
  if (elapsed <= 0) return { status: 'insufficient' };
  const rate = itemsDone / elapsed;
  if (rate <= 0) return { status: 'insufficient' };
  const remaining = totalItems - itemsDone;
  const margin = Number(marginPercent) || 0;
  const baseDays = remaining / rate;
  const daysNeeded = Math.ceil(baseDays * (1 + margin / 100));
  const projected = new Date(todayStr() + 'T00:00:00');
  projected.setDate(projected.getDate() + daysNeeded);
  return { status: 'ok', rate: rate, marginPercent: margin, daysNeeded: daysNeeded, projectedDateStr: projected.toLocaleDateString('sv-SE') };
}

function getDisciplineMeta(id, customMetas) {
  if (customMetas && customMetas[id]) {
    return customMetas[id];
  }
  if (DEFAULT_METAS[id]) {
    return DEFAULT_METAS[id];
  }
  const clean = (id || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return {
    sigla: clean.slice(0, 4) || 'MAT',
    color: '#3d5580',
  };
}

/* ============================= EXPORTADOR EXCEL ============================= */
function exportActivitiesToExcel(activities, allDisciplines, customMetas, customFileName) {
  if (!activities || activities.length === 0) {
    alert('Não há atividades de estudo no período para exportar.');
    return;
  }
  const headers = [
    'Data da Sessao', 'Hora do Registro', 'Sigla', 'Disciplina', 'Tipo de Estudo',
    'Duracao (Minutos)', 'Duracao Formatada', 'Questoes Feitas', 'Acertos', 'Erros', 'Aproveitamento (%)'
  ];

  const rows = activities.slice().sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)).map(a => {
    const disc = allDisciplines.find(d => d.id === a.disciplineId);
    const meta = getDisciplineMeta(a.disciplineId, customMetas);
    const dateFormatted = formatBR(a.date);
    const timeFormatted = a.createdAt ? new Date(a.createdAt).toLocaleTimeString('pt-BR') : '—';
    const durMin = Math.round(((a.seconds || 0) / 60) * 10) / 10;
    const durFmt = formatDuration(a.seconds || 0);
    const feitas = Number(a.feitas) || 0;
    const acertos = Number(a.acertos) || 0;
    const erros = feitas > acertos ? feitas - acertos : 0;
    const aprov = feitas > 0 ? ((acertos / feitas) * 100).toFixed(1).replace('.', ',') + '%' : '—';
    const discTitle = disc ? disc.name : a.disciplineId;

    return [
      dateFormatted, timeFormatted, meta.sigla,
      '"' + (discTitle || '').replace(/"/g, '""') + '"',
      '"' + (a.tipo || '').replace(/"/g, '""') + '"',
      durMin.toString().replace('.', ','),
      '"' + durFmt + '"',
      feitas, acertos, erros,
      '"' + aprov + '"'
    ].join(';');
  });

  const csvContent = '\uFEFF' + [headers.join(';')].concat(rows).join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', customFileName || ('registro_estudos_tcu_afce_' + todayStr() + '.csv'));
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function exportEditalToExcel(syllabus, state) {
  const headers = ['Bloco', 'Sigla', 'Disciplina', 'Topico do Edital', 'Incidencia (%)', 'Teoria Concluida', 'Revisao Feita', 'Questoes Feitas', 'Acertos', 'Erros', '% de Acerto'];

function DoughnutChart({ acertos, erros }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    const total = acertos + erros;
    const data = total === 0 ? [1] : [acertos, erros];
    const colors = total === 0 ? ['#E6D9BE'] : ['#2F7D53', '#AE4436'];
    const labels = total === 0 ? ['Sem dados'] : ['Acertos', 'Erros'];
    const aproveitamento = total ? pct(acertos, total) : 0;
    const mainText = total ? (aproveitamento + '%') : '—';

    const centerTextPlugin = {
      id: 'centerText',
      afterDraw(chart) {
        try {
          const ctx = chart.ctx;
          const chartArea = chart.chartArea;
          if (!chartArea) return;
          const centerX = (chartArea.left + chartArea.right) / 2;
          const centerY = (chartArea.top + chartArea.bottom) / 2;
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = '#132038';
          ctx.font = "600 26px Fraunces, Georgia, serif";
          ctx.fillText(mainText, centerX, centerY - 2);
          ctx.fillStyle = '#5a729c';
          ctx.font = "500 11px Inter, sans-serif";
          ctx.fillText('APROVEITAMENTO', centerX, centerY + 18);
          ctx.restore();
        } catch (err) {}
      }
    };

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderColor: '#F7F3EA', borderWidth: 3, hoverOffset: 6 }] },
      options: {
        cutout: '72%',
        plugins: {
          legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 12 }, color:'#132038', padding: 14, usePointStyle:true, pointStyle:'circle' } },
          tooltip: { enabled: total !== 0 }
        },
        maintainAspectRatio: false,
      },
      plugins: [centerTextPlugin],
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [acertos, erros]);

  return (
    <div className="relative w-full h-56">
      <canvas ref={canvasRef}></canvas>
    </div>
  );
}

    return { label: 'Em progresso', tone: 'bg-brass-100 text-brass-700' };

            <th className="text-left font-medium pb-1 pl-3">Diagnóstico</th>

function SyncModal({ state, onClose, onImport }) {
  const [code, setCode] = useState(() => encodeState(state));
  const [importCode, setImportCode] = useState('');
  const [copyLabel, setCopyLabel] = useState('Copiar código');
  const [importMsg, setImportMsg] = useState(null);

  const handleCopy = () => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(() => {
        setCopyLabel('Copiado!');
        setTimeout(() => setCopyLabel('Copiar código'), 1800);
      }).catch(() => {
        setCopyLabel('Selecione e copie manualmente');
      });
    } else {
      setCopyLabel('Selecione e copie manualmente');
    }
  };

  const handleImport = () => {
    if (!importCode.trim()) { setImportMsg({ ok:false, text:'Cole um código de backup antes de carregar.' }); return; }
    try {
      const parsed = decodeState(importCode);
      if (!parsed || typeof parsed !== 'object' || !parsed.topics) throw new Error('formato inválido');
      onImport(parsed);
      setImportMsg({ ok:true, text:'Progresso restaurado com sucesso!' });
    } catch (e) {
      setImportMsg({ ok:false, text:'Código inválido. Verifique se copiou o texto completo.' });
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink-950/60 backdrop-blur-sm no-print" onClick={onClose}>

function TopicRow({ topic, data, onChange }) {
  const d = data || { incidencia: '', teoria: false, revisao: false, feitas: 0, acertos: 0 };
  const feitas = Number(d.feitas) || 0;
  const acertos = Number(d.acertos) || 0;
  const has = feitas > 0;
  const p = has ? pct(acertos, feitas) : 0;
  const colors = accColor(p, has);

  const setField = (field, value) => {
    const updated = Object.assign({}, d);
    updated[field] = value;
    onChange(updated);
  };

  return (
    <tr className="border-b border-ink-50 hover:bg-brass-50/40 transition-colors align-middle">
      <td className="py-2.5 pl-4 pr-3 text-sm text-ink-800 max-w-md">{topic}</td>
      <td className="py-2.5 px-2 w-20">
        <input type="number" min="0" max="100" placeholder="—" value={d.incidencia}
          onChange={e => setField('incidencia', e.target.value)}
          className="numin" />
      </td>
      <td className="py-2.5 px-2 text-center w-16">
        <input type="checkbox" className="chk mx-auto" checked={Boolean(d.teoria)}
          onChange={e => setField('teoria', e.target.checked)} />
      </td>
      <td className="py-2.5 px-2 text-center w-16">
        <input type="checkbox" className="chk mx-auto" checked={Boolean(d.revisao)}
          onChange={e => setField('revisao', e.target.checked)} />
      </td>
      <td className="py-2.5 px-1 w-16">
        <input type="number" min="0" value={d.feitas === 0 ? '' : d.feitas} placeholder="0"
          onChange={e => {
            const v = Math.max(0, Number(e.target.value) || 0);
            const newAcertos = Math.min(acertos, v);
            onChange(Object.assign({}, d, { feitas: v, acertos: newAcertos }));
          }}
          className="numin" />
      </td>
      <td className="py-2.5 px-1 w-16">
        <input type="number" min="0" max={feitas || undefined} value={d.acertos === 0 ? '' : d.acertos} placeholder="0"
          onChange={e => {
            let v = Math.max(0, Number(e.target.value) || 0);
            if (feitas) v = Math.min(v, feitas);
            setField('acertos', v);
          }}
          className="numin" />
      </td>
      <td className={'py-2.5 pr-4 pl-2 w-20 text-right font-mono text-sm font-semibold ' + colors.text}>
        {has ? (p + '%') : '—'}
      </td>
    </tr>
  );
}

function DisciplineAccordion({ discipline, state, onTopicChange, onToggleOpen, onObsChange, query, startDate, marginPercent }) {
  const topicsMap = (state && state.topics) || {};
  const topicsData = discipline.topics.map((t, i) => topicsMap[discipline.id + '-' + i] || {});
  const totalTopics = discipline.topics.length;
  const teoriaOk = topicsData.filter(t => t.teoria).length;
  const revisaoOk = topicsData.filter(t => t.revisao).length;
  const feitas = topicsData.reduce((a, t) => a + (Number(t.feitas) || 0), 0);
  const acertos = topicsData.reduce((a, t) => a + (Number(t.acertos) || 0), 0);
  const has = feitas > 0;
  const p = has ? pct(acertos, feitas) : 0;
  const colors = accColor(p, has);
  const disc = (state && state.disciplinas && state.disciplinas[discipline.id]) || { open: false, obs: '' };
  const meta = getDisciplineMeta(discipline.id, state?.customMetas);

  const q = normalize(query || '');
  const visibleIdx = discipline.topics
    .map((t, i) => ({ t: t, i: i }))
    .filter(item => !q || normalize(discipline.name).indexOf(q) !== -1 || normalize(item.t).indexOf(q) !== -1);

  const proj = projectCompletion(startDate, teoriaOk, totalTopics, marginPercent);

  return (
    <div className="bg-paper-100 rounded-lg border border-ink-100 shadow-sm overflow-hidden">
      <button onClick={() => onToggleOpen(discipline.id)}
        className="w-full flex flex-wrap items-center gap-x-4 gap-y-2 px-4 sm:px-5 py-4 text-left hover:bg-brass-50/30 transition-colors">
        <div className="w-2.5 h-6 rounded-full flex-shrink-0" style={{ backgroundColor: meta.color }}></div>
        <svg className={'w-4 h-4 flex-shrink-0 text-brass-500 transition-transform duration-200 ' + (disc.open ? 'rotate-90' : '')} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
        </svg>
        <span className="font-serif text-base sm:text-lg text-ink-900 flex-shrink-0">
          <span className="font-mono text-xs font-bold text-ink-400 mr-2">[{meta.sigla}]</span>
          {discipline.name}
        </span>
        <span className="text-[11px] text-ink-400 hidden sm:inline">{totalTopics} tópicos</span>

        <div className="flex items-center gap-4 sm:gap-6 ml-auto text-xs">
          <div className="flex items-center gap-1.5">
            <span className="text-ink-400">Teoria</span>
            <span className="font-mono font-semibold text-ink-700">{pct(teoriaOk, totalTopics)}%</span>
          </div>
          <div className="hidden sm:flex items-center gap-1.5">
            <span className="text-ink-400">Revisão</span>
            <span className="font-mono font-semibold text-ink-700">{pct(revisaoOk, totalTopics)}%</span>
          </div>
          <div className={'px-2.5 py-1 rounded-full font-mono font-semibold ' + colors.bg + ' ' + colors.text}>
            {has ? (p + '% acerto') : 'sem dados'}
          </div>
        </div>
      </button>

      <div className={'accordion-body ' + (disc.open ? 'open' : '')}>
        <div>
          <div className="px-4 sm:px-5 pb-5 pt-1">
            <div className="mb-4 rounded-md border border-brass-200 bg-brass-50/50 px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-1.5 text-xs">
              <span className="font-semibold text-ink-600 uppercase tracking-wide text-[10px]">Projeção de conclusão da teoria</span>
              {proj.status === 'no-start' && (
                <span className="text-ink-400">Defina a "Data de início dos estudos" no topo da página para calcular.</span>
              )}
              {proj.status === 'no-progress' && (
                <span className="text-ink-400">Sem itens de teoria concluídos ainda nesta disciplina.</span>
              )}
              {proj.status === 'insufficient' && (
                <span className="text-ink-400">Dados insuficientes (aguarde ao menos 1 dia de progresso registrado).</span>
              )}
              {proj.status === 'done' && (
                <span className="text-okgreen font-semibold">Teoria 100% concluída nesta disciplina 🎉</span>
              )}
              {proj.status === 'ok' && (
                <div className="flex items-center gap-4 flex-wrap">
                  <span className="text-ink-600">Ritmo atual: <span className="font-mono font-semibold text-ink-900">{proj.rate.toFixed(2)}</span> itens/dia</span>
                  <span className="text-ink-600">Faltam <span className="font-mono font-semibold text-ink-900">{totalTopics - teoriaOk}</span> itens</span>
                  <span className="text-ink-600">Previsão: <span className="font-mono font-semibold text-brass-700">{formatBR(proj.projectedDateStr)}</span> ({proj.daysNeeded} dia{proj.daysNeeded === 1 ? '' : 's'})</span>
                </div>
              )}
            </div>

            <div className="overflow-x-auto rounded-md border border-ink-100">
              <table className="edital-tbl w-full min-w-[640px] border-collapse">
                <thead>
                  <tr className="text-paper-100 text-[11px] uppercase tracking-wide">
                    <th className="text-left py-2.5 pl-4 pr-3 font-medium">Tópico do edital</th>
                    <th className="text-center py-2.5 px-2 font-medium w-20">Incid. %</th>
                    <th className="text-center py-2.5 px-2 font-medium w-16">Teoria</th>
                    <th className="text-center py-2.5 px-2 font-medium w-16">Revisão</th>
                    <th className="text-center py-2.5 px-1 font-medium w-16">Feitas</th>
                    <th className="text-center py-2.5 px-1 font-medium w-16">Acertos</th>
                    <th className="text-right py-2.5 pr-4 pl-2 font-medium w-20">% Acerto</th>
                  </tr>
                </thead>
                <tbody>
                  {visibleIdx.map(item => {
                    const tid = discipline.id + '-' + item.i;
                    return (
                      <TopicRow key={tid} topic={item.t} data={topicsMap[tid]}
                        onChange={newData => onTopicChange(tid, newData)} />
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div className="mt-4">
              <label className="block text-xs font-semibold text-ink-500 mb-1.5">
                Observações &amp; Anotações ({discipline.name})
              </label>
              <textarea
                value={disc.obs || ''}
                onChange={e => onObsChange(discipline.id, e.target.value)}
                placeholder="Resumos, jurisprudências, artigos de lei, pontos fracos..."
                className="w-full h-24 text-sm p-3 rounded-md border border-ink-100 bg-paper-200/60 resize-y leading-relaxed"
              ></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function AddDisciplineModal({ onSave, onClose }) {

  const [block, setBlock] = useState('especificos');
  const [topicsText, setTopicsText] = useState('');

  const parsedTopics = useMemo(() => {
    return topicsText.split('\n').map(t => t.trim()).filter(t => t.length > 0);
  }, [topicsText]);

    e.preventDefault();
    if (!name.trim()) {
      alert('Por favor, informe o nome da matéria.');
      return;
    }
    const finalSigla = (sigla.trim() || name.replace(/[^A-Za-z0-9]/g, '').slice(0, 4)).toUpperCase();
    onSave({
      name: name.trim(),
      sigla: finalSigla,
      color: color || '#2F7D53',
      block: hasTopics ? block : null,

/* ============================= MODAL: EDITAR ATIVIDADE DE ESTUDO ============================= */
function EditActivityModal({ activity, cycle, allDisciplines, customMetas, onCancel, onSave }) {
  const [date, setDate] = useState(activity.date || todayStr());
  const [disciplineId, setDisciplineId] = useState(activity.disciplineId || 'audg');
  const [tipo, setTipo] = useState(activity.tipo || 'Leitura');
  const [hours, setHours] = useState(Math.floor((activity.seconds || 0) / 3600));
  const [minutes, setMinutes] = useState(Math.floor(((activity.seconds || 0) % 3600) / 60));
  const [feitas, setFeitas] = useState(activity.feitas === 0 || !activity.feitas ? '' : activity.feitas);
  const [acertos, setAcertos] = useState(activity.acertos === 0 || !activity.acertos ? '' : activity.acertos);
  const [stepId, setStepId] = useState(activity.stepId || 'auto');

  const selectedDiscipline = allDisciplines.find(d => d.id === disciplineId);
  const isGeneric = !selectedDiscipline || !selectedDiscipline.topics || selectedDiscipline.topics.length === 0;

  const matchingSteps = useMemo(() => {
    if (isGeneric) return [];
    const list = Array.isArray(cycle) ? cycle : [];
    return list.map((s, idx) => Object.assign({}, s, { stepIndex: idx + 1 })).filter(s => s.disciplineId === disciplineId);
  }, [cycle, disciplineId, isGeneric]);

  const handleSave = () => {
    const h = Math.max(0, Number(hours) || 0);
    const m = Math.max(0, Number(minutes) || 0);
    const totalSeconds = (h * 3600) + (m * 60);

    if (totalSeconds <= 0) {
      alert('Por favor, informe uma duração válida maior que zero.');
      return;
    }

    const f = Math.max(0, Number(feitas) || 0);
    let a = Math.max(0, Number(acertos) || 0);
    if (f) a = Math.min(a, f);

    onSave({
      id: activity.id,
      createdAt: activity.createdAt,
      date: date,
      disciplineId: disciplineId,
      tipo: tipo,
      seconds: totalSeconds,
      feitas: f,
      acertos: a,
      stepId: isGeneric ? null : (stepId === 'auto' ? null : (stepId === 'none' ? null : stepId)),
    });
  };

  const addTime = (addM) => {
    const curTotal = (Number(hours) || 0) * 60 + (Number(minutes) || 0) + addM;
    setHours(Math.floor(curTotal / 60));
    setMinutes(curTotal % 60);
  };

  const editalDisciplines = allDisciplines.filter(d => d.topics && d.topics.length > 0);
  const avulsasDisciplines = allDisciplines.filter(d => !d.topics || d.topics.length === 0);

  return (

  const [minutes, setMinutes] = useState(0);
  const [feitas, setFeitas] = useState('');
  const [acertos, setAcertos] = useState('');
  const [stepId, setStepId] = useState(activeStepId || 'auto');

  const selectedDiscipline = allDisciplines.find(d => d.id === disciplineId);
  const isGeneric = !selectedDiscipline?.topics || selectedDiscipline.topics.length === 0;

  const matchingSteps = useMemo(() => {
    if (isGeneric) return [];
    const list = Array.isArray(cycle) ? cycle : [];
    return list.map((s, idx) => Object.assign({}, s, { stepIndex: idx + 1 })).filter(s => s.disciplineId === disciplineId);
  }, [cycle, disciplineId, isGeneric]);

  const handleSave = () => {
    const h = Math.max(0, Number(hours) || 0);
    const m = Math.max(0, Number(minutes) || 0);
    const totalSeconds = (h * 3600) + (m * 60);

    if (totalSeconds <= 0) {
      alert('Por favor, informe uma duração válida maior que zero.');
      return;
    }

    const f = Math.max(0, Number(feitas) || 0);
    let a = Math.max(0, Number(acertos) || 0);
    if (f) a = Math.min(a, f);

    onSave({
      date: date,
      disciplineId: disciplineId,
      tipo: tipo,
      seconds: totalSeconds,
      feitas: f,
      acertos: a,
      stepId: isGeneric ? null : (stepId === 'auto' ? null : (stepId === 'none' ? null : stepId)),

  const addTime = (addM) => {

function StudyTimer({ disciplineId, setDisciplineId, allDisciplines, customMetas, activeCycleStep, onClearActiveStep, onSave, onOpenManual }) {
  const TIMER_STORAGE_KEY = 'tcu_afce_study_timer_v1';

  const readPersistedTimer = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(TIMER_STORAGE_KEY) || 'null');
      if (!saved) return { running: false, accumulated: 0, startedAt: null };
      const accumulated = Math.max(0, Number(saved.accumulated) || 0);
      const running = saved.running === true;
      const startedAt = (running && Number(saved.startedAt)) ? Number(saved.startedAt) : null;
      return { running: running, accumulated: accumulated, startedAt: startedAt };
    } catch (err) {
      return { running: false, accumulated: 0, startedAt: null };
    }
  };

  const initialTimer = useRef(readPersistedTimer()).current;
  const [running, setRunning] = useState(initialTimer.running);
  const [accumulated, setAccumulated] = useState(initialTimer.accumulated);
  const [displaySeconds, setDisplaySeconds] = useState(
    initialTimer.running && initialTimer.startedAt
      ? initialTimer.accumulated + Math.floor((Date.now() - initialTimer.startedAt) / 1000)
      : initialTimer.accumulated
  );
  const [showModal, setShowModal] = useState(false);
  const startRef = useRef(initialTimer.startedAt);
  const intervalRef = useRef(null);

  const persistTimer = (nextRunning, nextAccumulated, nextStartedAt) => {
    try {
      localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify({
        running: nextRunning,
        accumulated: Math.max(0, Math.round(nextAccumulated || 0)),
        startedAt: nextRunning ? nextStartedAt : null,
      }));
    } catch (err) {}
  };

  useEffect(() => {
    if (running) {
      if (!startRef.current) startRef.current = Date.now();
      persistTimer(true, accumulated, startRef.current);

      const updateDisplay = () => {
        const elapsed = accumulated + Math.floor((Date.now() - startRef.current) / 1000);
        setDisplaySeconds(elapsed);
      };

      updateDisplay();
      intervalRef.current = setInterval(updateDisplay, 250);
    } else {
      clearInterval(intervalRef.current);
      intervalRef.current = null;
      persistTimer(false, accumulated, null);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, accumulated]);

  const handleStartPause = () => {
    if (running) {
      clearInterval(intervalRef.current);
      const now = Date.now();
      const newAcc = accumulated + Math.floor((now - (startRef.current || now)) / 1000);
      setAccumulated(newAcc);
      setDisplaySeconds(newAcc);
      setRunning(false);
      startRef.current = null;
      persistTimer(false, newAcc, null);
    } else {
      const startedAt = Date.now();
      startRef.current = startedAt;
      persistTimer(true, accumulated, startedAt);
      setRunning(true);
    }
  };

  const handleReset = () => {
    clearInterval(intervalRef.current);
    startRef.current = null;
    setRunning(false);
    setAccumulated(0);
    setDisplaySeconds(0);
    persistTimer(false, 0, null);
  };

  const handleOpenSave = () => {
    if (running) handleStartPause();
    if (displaySeconds > 0) setShowModal(true);
  };

  const discObj = allDisciplines.find(d => d.id === disciplineId);
  const disciplineName = discObj ? discObj.name : '';
  const meta = getDisciplineMeta(disciplineId, customMetas);

  const editalDisciplines = allDisciplines.filter(d => d.topics && d.topics.length > 0);
  const avulsasDisciplines = allDisciplines.filter(d => !d.topics || d.topics.length === 0);

  return (
    <div id="cronometro-section" className="bg-ink-900 text-paper-100 rounded-lg shadow-sm p-6 sm:p-8 flex flex-col items-center relative">
      <div className="w-full flex justify-between items-center mb-4">
        <div className="text-xs text-brass-300 font-semibold tracking-wide uppercase">
          Sessão de estudo ao vivo
        </div>
        <button onClick={onOpenManual}
          className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-ink-800 hover:bg-ink-700 border border-ink-600 text-xs text-paper-100 font-medium transition-colors">
          <span>✍️</span> Lançar atividade manual
        </button>
      </div>

      {activeCycleStep && (
        <div className="w-full bg-brass-500/15 border border-brass-400/40 rounded-lg px-4 py-2.5 mb-5 flex items-center justify-between text-xs">
          <div className="flex items-center gap-2">
            <span className="w-2.5 h-2.5 rounded-full bg-okgreen animate-pulse flex-shrink-0"></span>
            <span className="text-paper-100">
              Etapa do Ciclo: <strong className="font-bold text-brass-300">[{meta.sigla}] {disciplineName}</strong> (Meta: {formatTarget(activeCycleStep.targetMinutes)})
            </span>
          </div>
          <button onClick={onClearActiveStep} className="text-brass-400 hover:text-white underline ml-3 text-[11px] flex-shrink-0">
            Desvincular
          </button>
        </div>
      )}

      <select value={disciplineId} onChange={e => { if (!running) setDisciplineId(e.target.value); }} disabled={running}
        className="w-full max-w-sm mb-6 px-3 py-2 rounded-md bg-ink-800 border border-ink-600 text-paper-100 text-sm text-center focus:outline-none focus:border-brass-400 disabled:opacity-60">
        <optgroup label="Disciplinas do Edital">
          {editalDisciplines.map(d => {
            const m = getDisciplineMeta(d.id, customMetas);
            return <option key={d.id} value={d.id}>[{m.sigla}] {d.name}</option>;
          })}
        </optgroup>
        <optgroup label="Atividades Gerais / Livres">
          {avulsasDisciplines.map(d => {
            const m = getDisciplineMeta(d.id, customMetas);
            return <option key={d.id} value={d.id}>[{m.sigla}] {d.name} (Fora do Ciclo)</option>;
          })}
        </optgroup>
      </select>

      <div className="font-mono text-5xl sm:text-6xl font-semibold tabular-nums tracking-wide text-brass-300 mb-6">
        {formatHMS(displaySeconds)}
      </div>

      <div className="flex items-center gap-3 flex-wrap justify-center">
        <button onClick={handleStartPause}
          className={'px-6 py-3 rounded-full text-sm font-semibold transition-colors ' + (running ? 'bg-okamber text-ink-950 hover:brightness-95' : 'bg-okgreen text-white hover:brightness-105')}>
          {running ? 'Pausar' : (displaySeconds > 0 ? 'Retomar' : 'Iniciar')}
        </button>
        <button onClick={handleReset} disabled={displaySeconds === 0 && !running}
          className="px-4 py-3 rounded-full text-sm font-medium bg-ink-800 border border-ink-600 text-paper-100 hover:bg-ink-700 disabled:opacity-40">
          Zerar
        </button>
        <button onClick={handleOpenSave} disabled={displaySeconds === 0}
          className="px-6 py-3 rounded-full text-sm font-semibold bg-brass-500 hover:bg-brass-600 text-white disabled:opacity-40">
          Salvar atividade
        </button>
      </div>

      {showModal && (
        <SaveActivityModal
          seconds={displaySeconds}
          disciplineName={disciplineName}
          cycleSteps={activeCycleStep ? [activeCycleStep] : []}
          activeStepId={activeCycleStep ? activeCycleStep.id : null}
          onCancel={() => setShowModal(false)}
          onConfirm={(activity) => {
            onSave(Object.assign({}, activity, { disciplineId: disciplineId }));
            setShowModal(false);
            handleReset();
          }}
        />
      )}
    </div>
  );
}

function EditCycleModal({ cycle, editalDisciplines, customMetas, onSave, onClose }) {
  const [stages, setStages] = useState(() => JSON.parse(JSON.stringify(Array.isArray(cycle) ? cycle : [])));
  const [newDisc, setNewDisc] = useState(editalDisciplines[0]?.id || 'audg');
  const [newMinutes, setNewMinutes] = useState(60);

  const handleAdd = () => {
    const newStage = {
      id: 'step_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      disciplineId: newDisc,
      targetMinutes: Math.max(15, Number(newMinutes) || 60),
      studiedSeconds: 0,
    };
    setStages(stages.concat([newStage]));
  };

  const handleRemove = (idx) => setStages(stages.filter((_, i) => i !== idx));

  const handleMove = (idx, dir) => {
    const targetIdx = idx + dir;
    if (targetIdx < 0 || targetIdx >= stages.length) return;
    const copy = stages.slice();
    const temp = copy[idx];
    copy[idx] = copy[targetIdx];
    copy[targetIdx] = temp;
    setStages(copy);
  };

  const handleUpdateMinutes = (idx, mins) => {
    const copy = stages.slice();
    copy[idx].targetMinutes = Math.max(5, Number(mins) || 60);
    setStages(copy);
  };

  const handleRestoreDefault = () => {
    if (confirm('Deseja restaurar as 10 etapas padrão do TCU?')) {
      setStages(buildDefaultCycle());
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink-950/60 backdrop-blur-sm no-print" onClick={onClose}>
      <div className="bg-paper-100 w-full max-w-2xl rounded-lg shadow-2xl border border-brass-200 max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-ink-100">
          <div>
            <h2 className="font-serif text-xl text-ink-900">Editar Ciclo de Estudos</h2>
            <p className="text-xs text-ink-400 mt-0.5">Adicione, ordene e configure a meta de estudo de cada matéria.</p>
          </div>
          <button onClick={onClose} className="text-ink-400 hover:text-ink-900 text-2xl leading-none px-1">&times;</button>
        </div>

        <div className="px-6 py-4 overflow-y-auto flex-1 space-y-4">
          <div className="bg-ink-50/60 rounded-lg p-3.5 border border-ink-100 flex flex-wrap items-end gap-2.5">
            <label className="flex-1 min-w-[200px]">
              <span className="block text-xs font-semibold text-ink-600 mb-1">Disciplina</span>
              <select value={newDisc} onChange={e => setNewDisc(e.target.value)}
                className="w-full px-3 py-1.5 rounded border border-ink-100 text-xs bg-white">
                {editalDisciplines.map(d => {
                  const m = getDisciplineMeta(d.id, customMetas);
                  return <option key={d.id} value={d.id}>[{m.sigla}] {d.name}</option>;
                })}
              </select>
            </label>

            <label className="w-28">
              <span className="block text-xs font-semibold text-ink-600 mb-1">Meta (minutos)</span>
              <input type="number" min="15" step="15" value={newMinutes} onChange={e => setNewMinutes(e.target.value)}
                className="w-full px-2 py-1.5 rounded border border-ink-100 text-xs font-mono text-center" />
            </label>

            <button onClick={handleAdd}
              className="px-4 py-1.5 rounded bg-brass-500 hover:bg-brass-600 text-white text-xs font-semibold shadow-xs">
              + Adicionar
            </button>
          </div>

          <div className="space-y-2">
            {stages.map((stage, idx) => {
              const disc = editalDisciplines.find(d => d.id === stage.disciplineId);
              const meta = getDisciplineMeta(stage.disciplineId, customMetas);

              return (
                <div key={stage.id || idx} className="flex items-center gap-2.5 px-3 py-2 rounded border border-ink-100 bg-white">
                  <span className="font-mono text-xs text-ink-400 w-6 text-center">{idx + 1}º</span>
                  <div className="w-2 h-6 rounded-full flex-shrink-0" style={{ backgroundColor: meta.color }}></div>

                  <div className="flex-1 min-w-0">
                    <span className="font-bold text-xs text-ink-900">[{meta.sigla}]</span>{' '}
                    <span className="text-xs text-ink-700 truncate">{disc ? disc.name : stage.disciplineId}</span>
                  </div>

                  <div className="flex items-center gap-1">
                    <input type="number" min="15" step="15" value={stage.targetMinutes}
                      onChange={e => handleUpdateMinutes(idx, e.target.value)}
                      className="w-16 px-1.5 py-1 rounded border border-ink-100 text-xs font-mono text-center" />
                    <span className="text-[11px] text-ink-400">min</span>
                  </div>

                  <div className="flex items-center gap-0.5">
                    <button onClick={() => handleMove(idx, -1)} disabled={idx === 0}
                      className="px-1.5 py-1 text-ink-400 hover:text-ink-900 disabled:opacity-20 text-xs">▲</button>
                    <button onClick={() => handleMove(idx, 1)} disabled={idx === stages.length - 1}
                      className="px-1.5 py-1 text-ink-400 hover:text-ink-900 disabled:opacity-20 text-xs">▼</button>
                  </div>

                  <button onClick={() => handleRemove(idx)} className="text-okred hover:text-okred/70 text-base leading-none px-1.5">
                    &times;
                  </button>
                </div>
              );
            })}
          </div>

          <div className="pt-2 flex justify-between items-center text-xs">
            <button onClick={handleRestoreDefault} className="text-ink-400 hover:text-brass-600 underline">
              Restaurar ciclo padrão sugerido (10 etapas)
            </button>
            <span className="text-ink-500 font-mono font-semibold">
              Total: {formatTarget(stages.reduce((a, s) => a + (Number(s.targetMinutes) || 0), 0))}
            </span>
          </div>
        </div>

        <div className="flex justify-end gap-2 px-6 py-4 border-t border-ink-100 bg-paper-100">
          <button onClick={onClose} className="px-4 py-2 rounded text-sm text-ink-600 hover:bg-ink-50">Cancelar</button>
          <button onClick={() => { onSave(stages); onClose(); }}
            className="px-5 py-2 rounded text-sm font-semibold bg-brass-500 hover:bg-brass-600 text-white">
            Salvar Alterações
          </button>
        </div>
      </div>
    </div>
  );
}

function HoursPieChart({ segments }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    const total = segments.reduce((a, s) => a + s.seconds, 0);
    const labels = total ? segments.map(s => s.label) : ['Sem registros no período'];
    const data = total ? segments.map(s => s.seconds) : [1];
    const colors = total ? segments.map(s => s.color) : ['#E6D9BE'];

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'pie',
      data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderColor: '#F7F3EA', borderWidth: 2 }] },
      options: {
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 11 }, color: '#132038', boxWidth: 10, padding: 10 } },
          tooltip: {
            enabled: total !== 0,
            callbacks: {
              label: (ctx) => {
                const s = segments[ctx.dataIndex];
                const sec = s ? s.seconds : 0;
                return ctx.label + ': ' + formatDuration(sec) + ' (' + pct(sec, total) + '%)';
              }
            }
          },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [segments]);
  return <div className="h-64"><canvas ref={canvasRef}></canvas></div>;
}

function PeriodStackedBarChart({ days, disciplines, customMetas }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    const labels = days.map(d => d.label);
    const datasets = disciplines
      .map((d) => ({
        label: d.name,
        data: days.map(day => Math.round(((day.byDiscipline[d.id] || 0) / 3600) * 100) / 100),
        backgroundColor: getDisciplineMeta(d.id, customMetas).color,
        stack: 'horas',
      }))
      .filter(ds => ds.data.some(v => v > 0));

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        maintainAspectRatio: false,
        scales: {
          x: { stacked: true, grid: { display: false }, ticks: { font: { family: 'Inter', size: 10 }, color: '#5a729c', maxRotation: 45, autoSkip: true } },
          y: { stacked: true, grid: { color: '#E6D9BE55' }, ticks: { font: { family: 'Inter', size: 10 }, color: '#5a729c', callback: v => v + 'h' } },
        },
        plugins: {
          legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 10 }, color: '#132038', boxWidth: 10, padding: 8 } },
          tooltip: {
            callbacks: {
              label: (ctx) => ctx.dataset.label + ': ' + formatDuration(ctx.parsed.y * 3600),
              footer: (items) => {
                const total = items.reduce((a, it) => a + it.parsed.y, 0);
                return 'Total: ' + formatDuration(total * 3600);
              },
            },
          },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [days, disciplines, customMetas]);
  return <div className="h-72"><canvas ref={canvasRef}></canvas></div>;
}

/* ============================= GRÁFICO DO STORY: EVOLUÇÃO COM DIAS EMPILHADOS ============================= */
function StoryPeriodStackedBarChart({ days, disciplines, customMetas }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;

    const labels = days.map(d => {
      if (d.date && !d.label.includes('-')) {
        const dObj = new Date(d.date + 'T00:00:00');
        const weekday = dObj.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').toUpperCase();
        const dateShort = formatBR(d.date).slice(0, 5);
        return [weekday, dateShort];
      }
      if (d.label.includes('-')) {
        const parts = d.label.split('-');
        return [parts[0].trim(), parts[1].trim()];
      }
      return d.label;
    });

    const datasets = disciplines
      .map((d) => ({
        label: d.name,
        data: days.map(day => Math.round(((day.byDiscipline[d.id] || 0) / 3600) * 100) / 100),
        backgroundColor: getDisciplineMeta(d.id, customMetas).color,
        stack: 'horas',
      }))
      .filter(ds => ds.data.some(v => v > 0));

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        layout: {
          padding: { left: 0, right: 4, top: 0, bottom: 0 }
        },
        scales: {
          x: {
            stacked: true,
            grid: { display: false },
            ticks: {
              font: { family: 'Inter', size: 9.5, weight: '700' },
              color: '#AEBDD4',
              maxRotation: 0,
              minRotation: 0,
              autoSkip: days.length > 10,
            }
          },
          y: {
            stacked: true,
            grid: { color: 'rgba(255, 255, 255, 0.08)' },
            ticks: {
              font: { family: 'Inter', size: 9.5 },
              color: '#AEBDD4',
              callback: v => v + 'h'
            }
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [days, disciplines, customMetas]);

  return <div className="w-full h-full"><canvas ref={canvasRef}></canvas></div>;
}

  // Monitora mudanças de sessão e carrega estado da nuvem ao logar
  useEffect(() => {
    if (!SUPABASE_CONFIGURED) return;

    // Verifica sessão existente ao montar
    supabaseGetUser().then(user => {
      setCurrentUser(user);
      setAuthLoading(false);
      if (user) {
        loadStateFromCloud(user.id).then(cloudPayload => {
          if (cloudPayload) {
            // Mescla: estado da nuvem tem prioridade (dados mais recentes)
            setState(prev => {
              const def = buildDefaultState();
              return {
                topics:              Object.assign({}, def.topics, cloudPayload.topics || prev.topics),
                disciplinas:         Object.assign({}, def.disciplinas, cloudPayload.disciplinas || prev.disciplinas),
                settings:            Object.assign({}, def.settings, cloudPayload.settings || prev.settings),
                history:             Object.assign({}, prev.history, cloudPayload.history || {}),
                activities:          Array.isArray(cloudPayload.activities) ? cloudPayload.activities : prev.activities,
                cycle:               Array.isArray(cloudPayload.cycle) ? cloudPayload.cycle : prev.cycle,
                cycleRoundsCompleted: Number(cloudPayload.cycleRoundsCompleted) || prev.cycleRoundsCompleted,
                customDisciplines:   Array.isArray(cloudPayload.customDisciplines) ? cloudPayload.customDisciplines : prev.customDisciplines,
                customMetas:         Object.assign({}, prev.customMetas, cloudPayload.customMetas || {}),
              };
            });
          }
        });
      }
    });

    // Listener de mudanças de autenticação
    const unsubscribe = supabaseOnAuthChange(user => {
      setCurrentUser(user);
      setAuthLoading(false);
    });
    return unsubscribe;
  }, []);

  // Persistência dupla: localStorage (sempre) + Supabase (se logado)
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.error('Erro ao salvar no localStorage', e); }

    if (currentUser) {
      setSyncStatus('syncing');
      debouncedSaveToCloud(currentUser.id, state)
        .then(ok => setSyncStatus(ok ? 'saved' : 'error'))
        .catch(() => setSyncStatus('error'));
    }
  }, [state, currentUser]);



  const editalSyllabus = useMemo(() => {

  /* Captura da tabela horizontal sem async/await */

      alert('Biblioteca de captura indisponível no momento.');

        link.href = canvas.toDataURL('image/png');

              setCopyImgFeedback(true);

/* Geração e compartilhamento no formato Instagram Story (9:16) com html-to-image */

      return;
    }

        pixelRatio: 2.4, // 450x800 * 2.4 = 1080x1920px (9:16 nativo)

        backgroundColor: '#132038',
        style: {
          visibility: 'visible',
          opacity: '1'
        }

      .then((dataUrl) => {

        // Tenta partilhar nativamente no telemóvel
        if (navigator.canShare && typeof File !== 'undefined') {

              .then(blob => {
                const file = new File([blob], fileName, { type: 'image/png' });

                  navigator.share({

      });

  }, []);

  const onSaveActivity = useCallback((activity) => {
    const record = Object.assign({
      id: 'act_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      date: activity.date || todayStr(),
      createdAt: Date.now(),
    }, activity);

    setState(prev => {
      const newActivities = (prev.activities || []).concat([record]);
      let updatedCycle = (prev.cycle || []).slice();

      const discObj = allStudyDisciplines.find(d => d.id === record.disciplineId);
      const hasTopics = discObj && discObj.topics && discObj.topics.length > 0;

      if (hasTopics && updatedCycle.length > 0) {
        let targetStepIdx = -1;

        if (record.stepId) {
          targetStepIdx = updatedCycle.findIndex(s => s.id === record.stepId);
        }
        if (targetStepIdx === -1) {
          targetStepIdx = updatedCycle.findIndex(s =>
            s.disciplineId === record.disciplineId && (s.studiedSeconds || 0) < (s.targetMinutes * 60)
          );
        }
        if (targetStepIdx === -1) {
          for (let i = updatedCycle.length - 1; i >= 0; i--) {
            if (updatedCycle[i].disciplineId === record.disciplineId) {
              targetStepIdx = i;
              break;
            }
          }
        }

        if (targetStepIdx !== -1) {
          record.stepId = updatedCycle[targetStepIdx].id;
          const currentStep = updatedCycle[targetStepIdx];
          updatedCycle[targetStepIdx] = Object.assign({}, currentStep, {
            studiedSeconds: (currentStep.studiedSeconds || 0) + (record.seconds || 0),
          });
        }
      }

      return Object.assign({}, prev, {
        activities: newActivities,
        cycle: updatedCycle,
      });
