  const onEditActivity = useCallback((updatedActivity) => {
      setState(prev => {
        const oldAct = (prev.activities || []).find(a => a.id === updatedActivity.id);
        if (!oldAct) return prev;

        let updatedCycle = (prev.cycle || []).slice();

        // 1. Reverte o tempo anterior do ciclo se estava vinculado
        if (oldAct.stepId && updatedCycle.length > 0) {
          const oldStepIdx = updatedCycle.findIndex(s => s.id === oldAct.stepId);
          if (oldStepIdx !== -1) {
            const curStep = updatedCycle[oldStepIdx];
            updatedCycle[oldStepIdx] = Object.assign({}, curStep, {
              studiedSeconds: Math.max(0, (curStep.studiedSeconds || 0) - (oldAct.seconds || 0)),
            });
          }
        }

        // 2. Aplica o novo tempo se a matéria possui tópicos
        const discObj = allStudyDisciplines.find(d => d.id === updatedActivity.disciplineId);
        const hasTopics = discObj && discObj.topics && discObj.topics.length > 0;

        if (hasTopics && updatedCycle.length > 0) {
          let targetStepIdx = -1;
          if (updatedActivity.stepId) {
            targetStepIdx = updatedCycle.findIndex(s => s.id === updatedActivity.stepId);
          }
          if (targetStepIdx === -1) {
            targetStepIdx = updatedCycle.findIndex(s =>
              s.disciplineId === updatedActivity.disciplineId && (s.studiedSeconds || 0) < (s.targetMinutes * 60)
            );
          }
          if (targetStepIdx === -1) {
            for (let i = updatedCycle.length - 1; i >= 0; i--) {
              if (updatedCycle[i].disciplineId === updatedActivity.disciplineId) {
                targetStepIdx = i;
                break;
              }
            }
          }

          if (targetStepIdx !== -1) {
            updatedActivity.stepId = updatedCycle[targetStepIdx].id;
            const curStep = updatedCycle[targetStepIdx];
            updatedCycle[targetStepIdx] = Object.assign({}, curStep, {
              studiedSeconds: (curStep.studiedSeconds || 0) + (updatedActivity.seconds || 0),
            });
          } else {
            updatedActivity.stepId = null;
          }
        } else {
          updatedActivity.stepId = null;
        }

        // 3. Atualiza no array preservando o timestamp de criação original
        const newActivities = (prev.activities || []).map(a =>
          a.id === updatedActivity.id ? Object.assign({}, a, updatedActivity) : a
        );

        return Object.assign({}, prev, {
          activities: newActivities,
          cycle: updatedCycle,
        });
      });
    }, [allStudyDisciplines]);

  const onDeleteActivity = useCallback((id) => {
    setState(prev => {
      const act = (prev.activities || []).find(a => a.id === id);
      let updatedCycle = (prev.cycle || []).slice();

      if (act && act.stepId && updatedCycle.length > 0) {
        const stepIdx = updatedCycle.findIndex(s => s.id === act.stepId);
        if (stepIdx !== -1) {
          const currentStep = updatedCycle[stepIdx];
          updatedCycle[stepIdx] = Object.assign({}, currentStep, {
            studiedSeconds: Math.max(0, (currentStep.studiedSeconds || 0) - (act.seconds || 0)),
          });
        }
      }

      return Object.assign({}, prev, {
        activities: (prev.activities || []).filter(a => a.id !== id),
        cycle: updatedCycle,
      });
    });
  }, []);

  const onCompleteCycle = useCallback(() => {
    setState(prev => Object.assign({}, prev, {
      cycleRoundsCompleted: (prev.cycleRoundsCompleted || 0) + 1,
      cycle: (prev.cycle || []).map(step => Object.assign({}, step, { studiedSeconds: 0 })),
    }));
    setShowCompleteCycleConfirm(false);
  }, []);

  const onUpdateCycle = useCallback((newCycle) => {
    setState(prev => Object.assign({}, prev, { cycle: newCycle }));
  }, []);

  const handleStartStep = (step) => {
    setTimerDiscipline(step.disciplineId);
    setActiveCycleStepId(step.id);
    setActiveTab('estudos');
    setTimeout(() => {
      const el = document.getElementById('cronometro-section');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }, 100);
  };

  const handleImport = (parsed) => {
    const freshDef = buildDefaultState();
    const mergedDisciplinas = {};
    Object.keys(freshDef.disciplinas).forEach(k => {
      mergedDisciplinas[k] = Object.assign({}, freshDef.disciplinas[k], (parsed.disciplinas && parsed.disciplinas[k]) || {});
    });

    setState(() => ({
      topics: Object.assign({}, freshDef.topics, parsed.topics || {}),
      disciplinas: Object.assign({}, mergedDisciplinas, parsed.disciplinas || {}),
      settings: Object.assign({}, freshDef.settings, parsed.settings || {}),
      history: Object.assign({}, parsed.history || {}),
      activities: Array.isArray(parsed.activities) ? parsed.activities : [],
      cycle: Array.isArray(parsed.cycle) ? parsed.cycle : freshDef.cycle,
      cycleRoundsCompleted: Number(parsed.cycleRoundsCompleted) || 0,
      customDisciplines: Array.isArray(parsed.customDisciplines) ? parsed.customDisciplines : [],
      customMetas: Object.assign({}, parsed.customMetas || {}),
    }));
    setTimeout(() => setShowSync(false), 900);
  };

  const handleReset = () => {
    const fresh = buildDefaultState();
    setState(fresh);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    setShowResetConfirm(false);
  };

  const handleSelectPreset = (preset) => {
    setDatePreset(preset);
    if (preset === 'dia') {
      setCustomStart(todayStr());
      setCustomEnd(todayStr());
    } else if (preset === 'semana') {
      setCustomStart(addDays(todayStr(), -6));
      setCustomEnd(todayStr());
    } else if (preset === 'mes') {
      setCustomStart(addDays(todayStr(), -29));
      setCustomEnd(todayStr());
    } else if (preset === 'tudo') {
      let minDate = todayStr();
      (state.activities || []).forEach(a => {
        if (a.date && a.date < minDate) minDate = a.date;
      });
      setCustomStart(minDate);
      setCustomEnd(todayStr());
    }
  };

  const handleCustomStartChange = (val) => {
    setCustomStart(val);
    setDatePreset('custom');
  };
  const handleCustomEndChange = (val) => {
    setCustomEnd(val);
    setDatePreset('custom');
  };

  const filteredActivities = useMemo(() => {
    return (state.activities || []).filter(a => {
      if (!a.date) return false;
      if (customStart && a.date < customStart) return false;
      if (customEnd && a.date > customEnd) return false;
      return true;
    });
  }, [state.activities, customStart, customEnd]);

  const numPeriodDays = useMemo(() => {
    if (!customStart || !customEnd) return 1;
    return Math.max(1, daysBetween(customStart, customEnd) + 1);
  }, [customStart, customEnd]);

  const periodTotalSeconds = useMemo(() => {
    return filteredActivities.reduce((a, s) => a + (Number(s.seconds) || 0), 0);
  }, [filteredActivities]);

  const avgDailySeconds = useMemo(() => {
    return numPeriodDays > 0 ? Math.round(periodTotalSeconds / numPeriodDays) : 0;
  }, [periodTotalSeconds, numPeriodDays]);

  const daysWithStudyCount = useMemo(() => {
    return new Set(filteredActivities.filter(a => (a.seconds || 0) > 0).map(a => a.date)).size;
  }, [filteredActivities]);

  const periodQuestions = useMemo(() => {
    const feitas = filteredActivities.reduce((a, it) => a + (Number(it.feitas) || 0), 0);
    const acertos = filteredActivities.reduce((a, it) => a + (Number(it.acertos) || 0), 0);
    return { feitas: feitas, acertos: acertos, pct: feitas ? pct(acertos, feitas) : 0 };
  }, [filteredActivities]);

  const periodAvgSecPerQuestion = useMemo(() => {
    let exSeconds = 0, exFeitas = 0;
    filteredActivities.forEach(a => {
      if (a.tipo === 'Exercício') {
        exSeconds += Number(a.seconds) || 0;
        exFeitas += Number(a.feitas) || 0;
      }
    });
    return (exSeconds > 0 && exFeitas > 0) ? (exSeconds / exFeitas) : null;
  }, [filteredActivities]);

  const performanceByDiscipline = useMemo(() => {
    const byDisc = {};
    filteredActivities.forEach(a => {
      const id = a.disciplineId;
      if (!byDisc[id]) byDisc[id] = { feitas: 0, acertos: 0, exSeconds: 0, exFeitas: 0 };
      const feitas = Number(a.feitas) || 0;
      const acertos = Number(a.acertos) || 0;
      byDisc[id].feitas += feitas;
      byDisc[id].acertos += acertos;
      if (a.tipo === 'Exercício') {
        byDisc[id].exSeconds += Number(a.seconds) || 0;
        byDisc[id].exFeitas += feitas;
      }
    });
    return Object.entries(byDisc).map(entry => {
      const discId = entry[0];
      const d = entry[1];
      const disc = allStudyDisciplines.find(x => x.id === discId);
      const meta = getDisciplineMeta(discId, state.customMetas);
      const erros = d.feitas > d.acertos ? d.feitas - d.acertos : 0;
      return {
        discId: discId,
        name: disc ? disc.name : discId,
        sigla: meta.sigla,
        color: meta.color,
        feitas: d.feitas,
        acertos: d.acertos,
        erros: erros,
        pctAcerto: d.feitas > 0 ? pct(d.acertos, d.feitas) : 0,
        avgSecPerQuestion: (d.exSeconds > 0 && d.exFeitas > 0) ? (d.exSeconds / d.exFeitas) : null,
      };
    }).filter(r => r.feitas > 0).sort((a, b) => b.feitas - a.feitas);
  }, [filteredActivities, allStudyDisciplines, state.customMetas]);

  const periodSegments = useMemo(() => {
    const byDiscipline = {};
    filteredActivities.forEach(a => {
      byDiscipline[a.disciplineId] = (byDiscipline[a.disciplineId] || 0) + (Number(a.seconds) || 0);
    });
    return Object.entries(byDiscipline).map(entry => {
      const discId = entry[0];
      const sec = entry[1];
      const disc = allStudyDisciplines.find(d => d.id === discId);
      const meta = getDisciplineMeta(discId, state.customMetas);
      return { discId: discId, label: disc ? disc.name : discId, sigla: meta.sigla, seconds: sec, color: meta.color };
    }).sort((a, b) => b.seconds - a.seconds);
  }, [filteredActivities, allStudyDisciplines, state.customMetas]);

  const topDiscipline = periodSegments.length > 0 ? periodSegments[0] : null;

  const topPeriodSegments = useMemo(() => buildTopSegments(periodSegments, 6), [periodSegments]);

  const periodDaysData = useMemo(() => {
    if (!customStart || !customEnd) return [];
    const count = Math.min(numPeriodDays, 366);

    if (count <= 35) {
      const days = [];
      for (let i = 0; i < count; i++) {
        const dStr = addDays(customStart, i);
        const byDiscipline = {};
        (state.activities || []).filter(a => a.date === dStr).forEach(a => {
          byDiscipline[a.disciplineId] = (byDiscipline[a.disciplineId] || 0) + (Number(a.seconds) || 0);
        });
        const weekday = new Date(dStr + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
        days.push({
          date: dStr,
          label: count <= 7 ? (weekday + ' ' + formatBR(dStr).slice(0, 5)) : formatBR(dStr).slice(0, 5),
          byDiscipline: byDiscipline,
        });
      }
      return days;
    }

    const grouped = [];
    for (let i = 0; i < count; i += 7) {
      const chunkStart = addDays(customStart, i);
      const chunkEnd = addDays(customStart, Math.min(count - 1, i + 6));
      const byDiscipline = {};
      (state.activities || []).filter(a => a.date >= chunkStart && a.date <= chunkEnd).forEach(a => {
        byDiscipline[a.disciplineId] = (byDiscipline[a.disciplineId] || 0) + (Number(a.seconds) || 0);
      });
      grouped.push({
        date: chunkStart,
        label: formatBR(chunkStart).slice(0, 5) + ' - ' + formatBR(chunkEnd).slice(0, 5),
        byDiscipline: byDiscipline,
      });
    }
    return grouped;
  }, [customStart, customEnd, numPeriodDays, state.activities]);

  const metrics = useMemo(() => {
    let totalTopics = 0, teoriaOk = 0, revisaoOk = 0, feitas = 0, acertos = 0;
    const tMap = state.topics || {};
    editalSyllabus.forEach(d => {
      d.topics.forEach((_, i) => {
        const t = tMap[d.id + '-' + i];
        if (!t) return;
        totalTopics++;
        if (t.teoria) teoriaOk++;
        if (t.revisao) revisaoOk++;
        feitas += Number(t.feitas) || 0;
        acertos += Number(t.acertos) || 0;
      });
    });
    const erros = feitas - acertos;
    return {
      totalTopics: totalTopics, teoriaOk: teoriaOk, revisaoOk: revisaoOk,
      teoriaPct: pct(teoriaOk, totalTopics),
      revisaoPct: pct(revisaoOk, totalTopics),
      feitas: feitas, acertos: acertos, erros: erros,
      aproveitamento: feitas ? pct(acertos, feitas) : 0,
    };
  }, [state.topics, editalSyllabus]);

  const disciplineRows = useMemo(() => {
    const tMap = state.topics || {};
    return editalSyllabus.map(d => {
      let feitas = 0, acertos = 0, teoriaOk = 0;
      d.topics.forEach((_, i) => {
        const t = tMap[d.id + '-' + i];
        if (!t) return;
        feitas += Number(t.feitas) || 0;
        acertos += Number(t.acertos) || 0;
        if (t.teoria) teoriaOk++;
      });
      return {
        id: d.id, name: d.name, short: d.name.length > 26 ? (d.name.slice(0, 24) + '…') : d.name,
        feitas: feitas, acertos: acertos, pctAcerto: feitas ? pct(acertos, feitas) : 0,
        teoriaOk: teoriaOk, teoriaPct: pct(teoriaOk, d.topics.length), totalTopics: d.topics.length,
      };
    });
  }, [state.topics, editalSyllabus]);

  useEffect(() => {
    const key = todayStr();
    const overall = metrics.aproveitamento;
    const avanco = metrics.teoriaPct;
    const perDiscipline = {};
    disciplineRows.forEach(r => { perDiscipline[r.id] = r.pctAcerto; });
    setState(prev => {
      const existing = (prev.history || {})[key];
      const unchanged = existing && existing.overall === overall && existing.avanco === avanco &&
        JSON.stringify(existing.perDiscipline) === JSON.stringify(perDiscipline);
      if (unchanged) return prev;
      const newHistory = Object.assign({}, prev.history);
      newHistory[key] = { overall: overall, avanco: avanco, perDiscipline: perDiscipline };
      return Object.assign({}, prev, { history: newHistory });
    });
  }, [metrics.aproveitamento, metrics.teoriaPct, disciplineRows]);

  const examCountdown = useMemo(() => {
    const s = state.settings || {};
    if (!s.examDate) return null;
    const days = daysBetween(todayStr(), s.examDate);
    return { examDate: s.examDate, days: days };
  }, [state.settings]);

  const editalProjection = useMemo(() => {
    const s = state.settings || {};
    return projectCompletion(s.startDate, metrics.teoriaOk, metrics.totalTopics, s.marginPercent);
  }, [state.settings, metrics.teoriaOk, metrics.totalTopics]);

  const progressChartData = useMemo(() => {
    const s = state.settings || {};
    const startDate = s.startDate;
    if (!startDate) return null;
    const todayIdx = daysBetween(startDate, todayStr());
    if (todayIdx < 0) return null;

    const byDay = {};
    Object.entries(state.history || {}).forEach(entry => {
      const date = entry[0];
      const v = entry[1];
      const idx = daysBetween(startDate, date);
      if (idx >= 0 && idx <= todayIdx) byDay[idx] = (v.avanco !== undefined ? v.avanco : 0);
    });

    const solid = [];
    let last = 0;
    for (let i = 0; i <= todayIdx; i++) {
      if (byDay[i] !== undefined) last = byDay[i];
      solid.push({ x: i, y: last });
    }
    const currentPct = last;

    let dashed = null;
    if (editalProjection.status === 'ok') {
      const projIdx = daysBetween(startDate, editalProjection.projectedDateStr);
      dashed = [{ x: todayIdx, y: currentPct }, { x: Math.max(projIdx, todayIdx + 1), y: 100 }];
    }

    return { startDate: startDate, todayIdx: todayIdx, solid: solid, dashed: dashed, currentPct: currentPct };
  }, [state.settings, state.history, editalProjection]);

  const filteredSyllabus = useMemo(() => {
    return editalSyllabus.filter(d => blockFilter === 'todos' || d.block === blockFilter)
      .map(d => {
        if (!query.trim()) return d;
        const q = normalize(query);
        const matchesName = normalize(d.name).indexOf(q) !== -1;
        const matchingTopics = d.topics.filter(t => normalize(t).indexOf(q) !== -1);
        if (matchesName || matchingTopics.length > 0) return d;
        return null;
      }).filter(Boolean);
  }, [blockFilter, query, editalSyllabus]);

  const readingPace = useMemo(() => {
    return editalSyllabus.map(d => {
      const acts = (state.activities || []).filter(a => a.disciplineId === d.id);
      const leituraSec = acts.filter(a => a.tipo === 'Leitura').reduce((s, a) => s + (Number(a.seconds) || 0), 0);
      const exercicioActs = acts.filter(a => a.tipo === 'Exercício');
      const exercicioSec = exercicioActs.reduce((s, a) => s + (Number(a.seconds) || 0), 0);
      const exerciciosFeitos = exercicioActs.reduce((s, a) => s + (Number(a.feitas) || 0), 0);
      const discRow = disciplineRows.find(r => r.id === d.id);
      const teoriaOkForDisc = discRow ? discRow.teoriaOk : 0;
      return {
        id: d.id, name: d.name,
        avgSecPerTopic: (leituraSec > 0 && teoriaOkForDisc > 0) ? (leituraSec / teoriaOkForDisc) : null,
        avgSecPerQuestion: (exercicioSec > 0 && exerciciosFeitos > 0) ? (exercicioSec / exerciciosFeitos) : null,
        leituraSec: leituraSec, exercicioSec: exercicioSec,
      };
    }).filter(r => r.leituraSec > 0 || r.exercicioSec > 0);
  }, [state.activities, disciplineRows, editalSyllabus]);

  const activeStepObj = useMemo(() => {
    return (state.cycle || []).find(s => s.id === activeCycleStepId) || null;
  }, [state.cycle, activeCycleStepId]);

  return (
    <div className="min-h-screen">
      <header className="bg-ink-900 text-paper-100 no-print">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-7">
          <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
            <div>
              <p className="text-brass-300 text-xs tracking-wide font-medium mb-1.5">Tribunal de Contas da União</p>
              <h1 className="font-serif text-2xl sm:text-3xl font-semibold leading-tight">
                Auditor Federal de Controle Externo
              </h1>
              <p className="text-ink-200 text-sm mt-1.5 max-w-xl">
                Edital verticalizado, Ciclo de estudos rastreável e gerenciador de matérias e cores.
              </p>
            </div>
            <div className="flex gap-2 flex-wrap flex-shrink-0 items-center">
              {/* Indicador de status de sincronização com a nuvem */}
              {SUPABASE_CONFIGURED && (
                <div className="flex items-center gap-1.5 text-xs text-ink-300 mr-1" title={
                  syncStatus === 'saved'   ? 'Dados sincronizados com a nuvem' :
                  syncStatus === 'syncing' ? 'Salvando na nuvem...' :
                  syncStatus === 'error'   ? 'Erro ao sincronizar — dados salvos localmente' :
                  currentUser ? 'Aguardando alterações...' : 'Faça login para sincronizar'
                }>
                  {syncStatus === 'syncing' && (
                    <svg className="w-4 h-4 animate-spin text-brass-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                  )}
                  {syncStatus === 'saved' && <span className="text-okgreen">☁ Sincronizado</span>}
                  {syncStatus === 'error'  && <span className="text-okred">⚠ Erro sync</span>}
                  {syncStatus === 'idle' && currentUser && <span className="text-ink-400">☁ Online</span>}
                  {!currentUser && SUPABASE_CONFIGURED && <span className="text-ink-500">☁ Offline</span>}
                </div>
              )}

              <button onClick={() => exportActivitiesToExcel(state.activities, allStudyDisciplines, state.customMetas)}
                className="px-3.5 py-2.5 rounded-md bg-ink-800 hover:bg-ink-700 border border-ink-600 text-paper-100 text-sm font-medium transition-colors flex items-center gap-1.5"
                title="Exportar todas as atividades de estudo para arquivo Excel (.csv)">
                <span>📊</span> Exportar Excel
              </button>
              <button onClick={() => setShowSync(true)}
                className="px-3.5 py-2.5 rounded-md bg-brass-500 hover:bg-brass-600 text-ink-950 text-sm font-semibold transition-colors flex items-center gap-1.5">
                <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                Backup
              </button>

              {/* Botão de Autenticação — só aparece se Supabase estiver configurado */}
              {SUPABASE_CONFIGURED && (
                currentUser ? (
                  <button
                    onClick={() => supabaseSignOut().then(() => setCurrentUser(null))}
                    className="px-3.5 py-2.5 rounded-md bg-ink-700 hover:bg-ink-600 border border-ink-500 text-paper-100 text-sm font-medium transition-colors flex items-center gap-1.5"
                    title={"Sair da conta: " + currentUser.email}>
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Sair
                  </button>
                ) : (
                  <button
                    onClick={() => setShowAuthModal(true)}
                    className="px-3.5 py-2.5 rounded-md bg-brass-600 hover:bg-brass-700 text-paper-100 text-sm font-semibold transition-colors flex items-center gap-1.5"
                    title="Fazer login para sincronizar dados na nuvem">
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                    {authLoading ? 'Carregando...' : 'Login / Cadastro'}
                  </button>
                )
              )}

              <button onClick={() => setShowResetConfirm(true)}
                className="px-3 py-2.5 rounded-md bg-ink-800 hover:bg-ink-700 border border-ink-600 text-paper-100 text-sm font-medium transition-colors">
                Resetar
              </button>
            </div>

          </div>
        </div>
      </header>

      <div className="bg-ink-800 no-print">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 flex gap-1">
          {[
            { key: 'edital', label: 'Edital & Métricas' },
            { key: 'estudos', label: 'Ciclo de Estudos & Cronômetro' },
          ].map(t => (
            <button key={t.key} onClick={() => setActiveTab(t.key)}
              className={'px-4 py-3 text-sm font-medium border-b-2 transition-colors ' + (
                activeTab === t.key
                  ? 'border-brass-400 text-paper-100'
                  : 'border-transparent text-ink-300 hover:text-paper-100'
              )}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      <main className="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-8">
        {activeTab === 'edital' && (
        <>
        <section className="bg-ink-900 text-paper-100 rounded-lg shadow-sm p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center gap-6 no-print">
          <div className="flex-1 grid grid-cols-1 sm:grid-cols-3 gap-4">
            <label className="block">
              <span className="text-[11px] uppercase tracking-wide text-ink-300 block mb-1.5">Data de início dos estudos</span>
              <input type="date" value={(state.settings && state.settings.startDate) || ''}
                onChange={e => onSettingsChange('startDate', e.target.value)}
                className="w-full px-3 py-2 rounded-md bg-ink-800 border border-ink-600 text-paper-100 text-sm focus:outline-none focus:border-brass-400" />
            </label>
            <label className="block">
              <span className="text-[11px] uppercase tracking-wide text-ink-300 block mb-1.5">Data da prova</span>
              <input type="date" value={(state.settings && state.settings.examDate) || ''}
                onChange={e => onSettingsChange('examDate', e.target.value)}
                className="w-full px-3 py-2 rounded-md bg-ink-800 border border-ink-600 text-paper-100 text-sm focus:outline-none focus:border-brass-400" />
            </label>
            <label className="block">
              <span className="text-[11px] uppercase tracking-wide text-ink-300 block mb-1.5">Margem de segurança (%)</span>
              <input type="number" min="0" max="300" step="5" value={(state.settings && state.settings.marginPercent !== undefined) ? state.settings.marginPercent : 20}
                onChange={e => onSettingsChange('marginPercent', Math.max(0, Number(e.target.value) || 0))}

/* ============================= MODAL DE AUTENTICAÇÃO ============================= */
function AuthModal({ onClose, onSuccess }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [successMsg, setSuccessMsg] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    setSuccessMsg('');
    if (!email.trim() || !password.trim()) { setError('Preencha e-mail e senha.'); return; }
    setLoading(true);
    try {
      if (mode === 'login') {
        const user = await supabaseSignIn(email.trim(), password);
        onSuccess(user);
      } else {
        await supabaseSignUp(email.trim(), password);
        setSuccessMsg('Conta criada! Verifique seu e-mail para confirmar o cadastro, depois faca login.');
        setMode('login');
      }
    } catch (err) {
      const msg = (err.message || '').toLowerCase();
      if (msg.includes('invalid login credentials') || msg.includes('email not confirmed')) {
        setError('E-mail ou senha invalidos. Verifique os dados ou confirme seu e-mail.');
      } else if (msg.includes('user already registered')) {
        setError('Este e-mail ja esta cadastrado. Faca login.');
        setMode('login');
      } else if (msg.includes('password should be at least')) {
        setError('A senha deve ter pelo menos 6 caracteres.');
      } else {
        setError(err.message || 'Erro ao autenticar. Tente novamente.');
      }
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink-950/70 backdrop-blur-sm no-print"
         onClick={onClose}>
      <div className="bg-paper-100 w-full max-w-sm rounded-xl shadow-2xl border border-brass-200 p-6"
           onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <div>
            <h3 className="font-serif text-lg text-ink-900">
              {mode === 'login' ? 'Entrar na conta' : 'Criar conta'}
            </h3>
            <p className="text-xs text-ink-400 mt-0.5">
              {mode === 'login'
                ? 'Sincronize seus dados em qualquer dispositivo.'
                : 'Crie uma conta para salvar seus dados na nuvem.'}
            </p>
          </div>
          <button onClick={onClose} className="text-ink-400 hover:text-ink-700 text-xl leading-none">x</button>
        </div>
        <div className="flex rounded-lg overflow-hidden border border-ink-200 mb-5">
          {['login', 'signup'].map(m => (
            <button key={m}
              onClick={() => { setMode(m); setError(''); setSuccessMsg(''); }}
              className={'flex-1 py-2 text-sm font-medium transition-colors ' + (
                mode === m ? 'bg-ink-900 text-paper-100' : 'bg-paper-100 text-ink-500 hover:bg-ink-50'
              )}>
              {m === 'login' ? 'Login' : 'Cadastro'}
            </button>
          ))}
        </div>
        {successMsg && (
          <div className="mb-4 p-3 rounded-md bg-okgreen/10 border border-okgreen/30 text-okgreen text-sm">{successMsg}</div>
        )}
        {error && (
          <div className="mb-4 p-3 rounded-md bg-okred/10 border border-okred/30 text-okred text-sm">{error}</div>
        )}
        <form onSubmit={handleSubmit} className="space-y-3">
          <div>
            <label className="block text-xs font-medium text-ink-600 mb-1">E-mail</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
              placeholder="seu@email.com" required
              className="w-full px-3 py-2 text-sm border border-ink-200 rounded-md focus:outline-none focus:border-brass-400 bg-white" />
          </div>
          <div>
            <label className="block text-xs font-medium text-ink-600 mb-1">Senha</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)}
              placeholder="Minimo 6 caracteres" required minLength={6}
              className="w-full px-3 py-2 text-sm border border-ink-200 rounded-md focus:outline-none focus:border-brass-400 bg-white" />
          </div>
          <button type="submit" disabled={loading}
            className="w-full py-2.5 rounded-md bg-brass-500 hover:bg-brass-600 text-ink-950 text-sm font-semibold transition-colors disabled:opacity-60 disabled:cursor-not-allowed mt-1">
            {loading
              ? (mode === 'login' ? 'Entrando...' : 'Criando conta...')
              : (mode === 'login' ? 'Entrar' : 'Criar conta')}
          </button>
        </form>
        <p className="mt-4 text-center text-[11px] text-ink-400">
          Seus dados sao armazenados com seguranca no Supabase.
          Autenticacao por e-mail com isolamento RLS por usuario.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
